<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>News Anywhere</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: #0d0d0d;
      --paper: #f5f0e8;
      --accent: #c8102e;
      --muted: #8a8070;
      --card: #fffdf8;
      --border: #d4cfc4;
      --shadow: rgba(0,0,0,0.06);
      --toggle-bg: #d4cfc4;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
 
    [data-theme="dark"] {
      --ink: #f0ebe0;
      --paper: #141414;
      --accent: #e8304a;
      --muted: #7a7060;
      --card: #1e1e1e;
      --border: #2e2e2e;
      --shadow: rgba(0,0,0,0.3);
      --toggle-bg: #3a3a3a;
    }
 
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }
 
    header {
      border-bottom: 3px double var(--ink);
      padding: 0 2rem;
      background: var(--paper);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background var(--transition), border-color var(--transition);
    }
 
    .masthead {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 1.2rem 0 0.6rem;
      border-bottom: 1px solid var(--border);
      transition: border-color var(--transition);
    }
 
    .masthead h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      text-align: center;
    }
 
    .masthead h1 span { color: var(--accent); }
 
    .dateline {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-top: 0.25rem;
    }
 
    .live-time {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
      margin-top: 0.2rem;
      font-family: monospace;
    }
 
    .theme-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      border: 1.5px solid var(--border);
      cursor: pointer;
      width: 52px;
      height: 28px;
      border-radius: 999px;
      background: var(--toggle-bg);
      transition: background var(--transition), border-color var(--transition);
      display: flex;
      align-items: center;
      padding: 3px;
    }
 
    .theme-toggle::after {
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--paper);
      transition: transform var(--transition), background var(--transition);
      display: block;
    }
 
    [data-theme="dark"] .theme-toggle::after { transform: translateX(24px); }
 
    .theme-icon {
      position: absolute;
      font-size: 0.65rem;
      pointer-events: none;
    }
    .icon-sun { left: 6px; }
    .icon-moon { right: 5px; }
 
    .search-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.8rem 0;
      flex-wrap: wrap;
      justify-content: center;
    }
 
    .input-wrap { position: relative; }
 
    .input-wrap .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 2px;
      display: none;
    }
    .input-wrap .clear-btn:hover { color: var(--accent); }
    .input-wrap input:not(:placeholder-shown) + .clear-btn { display: block; }
 
    .search-bar input {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      padding: 0.5rem 1.8rem 0.5rem 0.9rem;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--ink);
      outline: none;
      width: 160px;
      transition: border-color 0.2s, background var(--transition), color var(--transition);
    }
 
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--muted); font-style: italic; }
 
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-style: italic;
    }
 
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s;
    }
 
    .live-dot.active {
      opacity: 1;
      animation: pulse 1s infinite;
    }
 
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.5; }
    }
 
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
 
    .about-section {
      text-align: center;
      margin-bottom: 2rem;
      padding: 1rem;
      border-bottom: 1px dashed var(--border);
    }
 
    .about-section p {
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }
 
    .about-section strong {
      color: var(--accent);
    }
 
    #status {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 1.5rem;
      min-height: 1.4em;
    }
 
    #results {
      columns: 3 280px;
      column-gap: 1.4rem;
    }
 
    .skeleton-card {
      break-inside: avoid;
      margin-bottom: 1.4rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--border);
      padding: 1.2rem;
    }
 
    .skeleton-line {
      height: 12px;
      background: linear-gradient(90deg, var(--border) 25%, var(--paper) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 2px;
      margin-bottom: 8px;
    }
 
    .skeleton-line.img { height: 140px; margin-bottom: 12px; }
    .skeleton-line.short { width: 55%; }
 
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
 
    .article-card {
      break-inside: avoid;
      margin-bottom: 1.4rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--ink);
      padding: 1.2rem;
      transition: box-shadow 0.2s, transform 0.2s;
    }
 
    .article-card:hover {
      box-shadow: 4px 4px 0 var(--ink);
      transform: translateY(-3px);
    }
 
    .card-source {
      font-size: 0.63rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
 
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.6rem;
      color: var(--ink);
    }
 
    .card-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 0.8rem;
    }
 
    .card-img {
      width: 100%;
      height: 155px;
      object-fit: cover;
      margin-bottom: 0.8rem;
      border: 1px solid var(--border);
    }
 
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 0.7rem;
    }
 
    .card-date { font-size: 0.68rem; color: var(--muted); }
 
    .card-link {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--ink);
    }
    .card-link:hover { color: var(--accent); border-color: var(--accent); }
 
    .bookmark-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      border-bottom: 1px solid var(--ink);
      padding: 0 0 2px 0;
    }
    .bookmark-btn:hover { color: var(--accent); border-color: var(--accent); }
 
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-state .big { font-size: 4rem; opacity: 0.2; margin-bottom: 0.5rem; }
    .empty-state p { font-size: 0.88rem; }
 
    #load-more-trigger {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-style: italic;
    }
 
    .load-spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
 
    .end-marker {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .end-marker::before, .end-marker::after { content: '— '; }
 
    .bookmark-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent);
      color: white;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      z-index: 200;
      animation: fadeUp 0.3s ease;
    }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
 
    @media (max-width: 600px) {
      .search-bar input { width: 100%; }
      .live-indicator { display: none; }
      #results { columns: 1; }
    }
  </style>
</head>
<body>
 
<header>
  <div class="masthead">
    <div>
      <h1>News<span>Anywhere</span></h1>
      <div class="dateline" id="dateline"></div>
      <div class="live-time" id="liveTime"></div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <span class="theme-icon icon-sun">☀️</span>
      <span class="theme-icon icon-moon">🌙</span>
    </button>
  </div>
  <div class="search-bar">
    <div class="input-wrap">
      <input type="text" id="location" placeholder="Location" />
      <button class="clear-btn" onclick="clearInput('location')">✕</button>
    </div>
    <div class="input-wrap">
      <input type="text" id="genre" placeholder="Topic" />
      <button class="clear-btn" onclick="clearInput('genre')">✕</button>
    </div>
    <div class="input-wrap">
      <input type="text" id="keyword" placeholder="Keyword" />
      <button class="clear-btn" onclick="clearInput('keyword')">✕</button>
    </div>
    <div class="live-indicator">
      <div class="live-dot" id="liveDot"></div>
      <span>Live</span>
    </div>
  </div>
</header>
 
<main>
  <div class="about-section">
    <p><strong>NewsAnywhere</strong> — Search news by location, topic, and keywords. Built for explorers by an explorer herself.</p>
  </div>
  
  <div id="status"></div>
  <div id="results">
    <div class="empty-state">
      <div class="big">📰</div>
      <p>Start typing to fetch live news instantly.</p>
    </div>
  </div>
  <div id="load-more-trigger"></div>
</main>
 
<script>
  // INIT
  document.getElementById('dateline').textContent =
    new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' }).toUpperCase();
 
  function updateLiveTime() {
    const now = new Date();
    document.getElementById('liveTime').textContent = `🕘 ${now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' })} IST • LIVE`;
  }
  updateLiveTime();
  setInterval(updateLiveTime, 1000);
 
  // THEME
  const savedTheme = localStorage.getItem('na-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
 
  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('na-theme', next);
  }
 
  // STATE
  let debounceTimer = null;
  let currentPage = 1;
  let currentQuery = '';
  let isLoading = false;
  let hasMore = true;
  let totalLoaded = 0;
  const PAGE_SIZE = 12;
 
  function showToast(msg, duration = 2000) {
    let toast = document.querySelector('.bookmark-toast');
    if (toast) toast.remove();
    toast = document.createElement('div');
    toast.className = 'bookmark-toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), duration);
  }
 
  // BOOKMARKS
  function saveBookmark(article) {
    let bookmarks = JSON.parse(localStorage.getItem('na_bookmarks') || '[]');
    if (bookmarks.some(b => b.url === article.url)) {
      showToast('Already bookmarked');
      return;
    }
    bookmarks.unshift({ title: article.title, url: article.url, source: article.source?.name });
    localStorage.setItem('na_bookmarks', JSON.stringify(bookmarks.slice(0, 20)));
    showToast('📌 Saved');
  }
 
  function onInputChange() {
    clearTimeout(debounceTimer);
    document.getElementById('liveDot').classList.add('active');
 
    debounceTimer = setTimeout(() => {
      document.getElementById('liveDot').classList.remove('active');
      
      const location = document.getElementById('location').value.trim();
      const genre = document.getElementById('genre').value.trim();
      const keyword = document.getElementById('keyword').value.trim();
      const query = [location, genre, keyword].filter(Boolean).join(' ');
 
      if (!query) {
        document.getElementById('results').innerHTML = `<div class="empty-state"><div class="big">📰</div><p>Start typing to fetch live news instantly.</p></div>`;
        document.getElementById('load-more-trigger').innerHTML = '';
        return;
      }
 
      currentPage = 1;
      hasMore = true;
      totalLoaded = 0;
      currentQuery = query;
      document.getElementById('results').innerHTML = '';
      fetchNews();
    }, 500);
  }
 
  function clearInput(id) {
    document.getElementById(id).value = '';
    onInputChange();
  }
 
  async function fetchNews() {
    if (isLoading || !hasMore) return;
    isLoading = true;
 
    const location = document.getElementById('location').value.trim();
    const genre = document.getElementById('genre').value.trim();
    const keyword = document.getElementById('keyword').value.trim();
 
    const params = new URLSearchParams();
    if (location) params.append('location', location);
    if (genre) params.append('genre', genre);
    if (keyword) params.append('keyword', keyword);
    params.append('page', currentPage);
    params.append('pageSize', PAGE_SIZE);
 
    if (currentPage === 1) {
      document.getElementById('results').innerHTML = '<div class="skeleton-card"><div class="skeleton-line img"></div><div class="skeleton-line short"></div><div class="skeleton-line short"></div></div>'.repeat(6);
    } else {
      document.getElementById('load-more-trigger').innerHTML = '<span class="load-spinner"></span> Loading...';
    }
 
    try {
      const res = await fetch(`/api/news?${params}`);
      const data = await res.json();
 
      if (data.articles && data.articles.length > 0) {
        if (currentPage === 1) document.getElementById('results').innerHTML = '';
        appendArticles(data.articles);
        totalLoaded += data.articles.length;
        document.getElementById('status').innerHTML = `📰 ${totalLoaded} stories for "${currentQuery}"`;
        hasMore = data.hasMore === true;
        currentPage++;
      } else {
        if (currentPage === 1) {
          document.getElementById('results').innerHTML = `<div class="empty-state"><div class="big">🔍</div><p>No results. Try different words.</p></div>`;
        }
        hasMore = false;
      }
 
      document.getElementById('load-more-trigger').innerHTML = hasMore ? '' : '<div class="end-marker">End of results</div>';
    } catch (err) {
      document.getElementById('results').innerHTML = `<div class="empty-state"><div class="big">⚠️</div><p>Connection error. Refresh and try again.</p></div>`;
    }
 
    isLoading = false;
  }
 
  function appendArticles(articles) {
    const container = document.getElementById('results');
    articles.forEach(article => {
      const card = document.createElement('div');
      card.className = 'article-card';
      card.innerHTML = `
        ${article.urlToImage ? `<img class="card-img" src="${article.urlToImage}" onerror="this.style.display='none'" />` : ''}
        <div class="card-source">${article.source?.name || 'News'}</div>
        <div class="card-title">${article.title || ''}</div>
        ${article.description ? `<p class="card-desc">${article.description.slice(0, 120)}…</p>` : ''}
        <div class="card-footer">
          <span class="card-date">${article.publishedAt ? new Date(article.publishedAt).toLocaleDateString() : ''}</span>
          <div style="display: flex; gap: 12px;">
            <button class="bookmark-btn" onclick="saveBookmark(${JSON.stringify(article).replace(/</g, '\\u003c')})">🔖 Save</button>
            <a class="card-link" href="${article.url}" target="_blank">Read →</a>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }
 
  // Event listeners
  document.getElementById('location').addEventListener('input', onInputChange);
  document.getElementById('genre').addEventListener('input', onInputChange);
  document.getElementById('keyword').addEventListener('input', onInputChange);
 
  // Infinite scroll
  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && !isLoading && hasMore && currentQuery) fetchNews();
  }, { rootMargin: '300px' });
  observer.observe(document.getElementById('load-more-trigger'));
</script>
</body>
</html>
