<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsAnywhere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0a0a;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        /* Light theme */
        body.light {
            background: #f5f5f5;
            color: #1a1a1a;
        }

        body.light .news-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
        }

        body.light .filters input {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00ff88, #00b8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input, button {
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 12px;
            border: none;
            outline: none;
        }

        input {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            flex: 1;
            min-width: 150px;
        }

        button {
            background: linear-gradient(135deg, #00ff88, #00b8ff);
            color: #0a0a0a;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        .news-card {
            background: #1a1a1a;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 16px;
            transition: transform 0.2s;
        }

        .news-card:hover {
            transform: translateY(-3px);
        }

        .news-card h3 {
            margin: 0 0 12px 0;
            font-size: 1.3rem;
        }

        .news-card h3 a {
            color: #00ff88;
            text-decoration: none;
        }

        .news-card p {
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .source {
            color: #666;
            font-size: 13px;
        }

        .read-link {
            display: inline-block;
            margin-top: 12px;
            color: #00b8ff;
            text-decoration: none;
            font-weight: bold;
        }

        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
        }

        body.light .dark-mode-toggle {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #ccc;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff4444;
        }

        .live-badge {
            display: inline-block;
            background: #ff4444;
            color: white;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-left: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .results-count {
            text-align: center;
            margin-bottom: 20px;
            color: #888;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .filters {
                flex-direction: column;
            }
            input, button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    
    <h1>📰 NewsAnywhere</h1>
    <p class="subtitle">Get live news by location, topic, and keywords</p>
    
    <div class="filters">
        <input type="text" id="location" placeholder="📍 Location (e.g., India)" value="India">
        <input type="text" id="topic" placeholder="🎵 Topic (e.g., education)" value="education">
        <input type="text" id="keywords" placeholder="🔑 Keywords (e.g., cbse)" value="cbse">
        <button onclick="searchNews()">Search → <span id="liveBadge" class="live-badge" style="display: none;">LIVE</span></button>
    </div>
    
    <div id="results">
        <div class="loading">✨ Enter your search terms above ✨</div>
    </div>

    <script>
        // ✅ FIXED: Using relative URL - works on localhost AND Render
        const API_URL = '/api/news';

        async function searchNews() {
            const location = document.getElementById('location').value;
            const topic = document.getElementById('topic').value;
            const keywords = document.getElementById('keywords').value;
            
            const resultsDiv = document.getElementById('results');
            const liveBadge = document.getElementById('liveBadge');
            
            // Show loading state
            resultsDiv.innerHTML = '<div class="loading">📡 Fetching live news... ⏳</div>';
            liveBadge.style.display = 'inline-block';
            
            try {
                // Build query string
                let query = '';
                if (location) query += location + ' ';
                if (topic) query += topic + ' ';
                if (keywords) query += keywords;
                query = query.trim();
                
                // ✅ Using relative URL - THIS IS THE FIX
                const response = await fetch(`${API_URL}?q=${encodeURIComponent(query)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.articles && data.articles.length > 0) {
                    resultsDiv.innerHTML = `
                        <div class="results-count">📰 ${data.articles.length} stories for "${query}"</div>
                        ${data.articles.map(article => `
                            <div class="news-card">
                                <h3>
                                    <a href="${article.url}" target="_blank">${article.title || 'No title'}</a>
                                </h3>
                                <p>${article.description || 'Click READ to view full article...'}</p>
                                <span class="source">
                                    📰 ${article.source?.name || 'Unknown Source'} | 
                                    📅 ${article.publishedAt ? new Date(article.publishedAt).toLocaleDateString() : 'Date unknown'}
                                </span>
                                <br>
                                <a href="${article.url}" target="_blank" class="read-link">READ →</a>
                            </div>
                        `).join('')}
                    `;
                } else {
                    resultsDiv.innerHTML = '<div class="error">😔 No news found. Try different keywords!</div>';
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = `<div class="error">❌ Could not connect to server. Please try again later.<br><br>💡 Tip: Make sure your search terms are valid.</div>`;
                liveBadge.style.display = 'none';
            } finally {
                setTimeout(() => {
                    liveBadge.style.display = 'none';
                }, 3000);
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('light');
            const btn = document.querySelector('.dark-mode-toggle');
            if (document.body.classList.contains('light')) {
                btn.innerHTML = '☀️ Light Mode';
            } else {
                btn.innerHTML = '🌙 Dark Mode';
            }
        }
        
        // Load default search on page load
        searchNews();
    </script>
</body>
</html>
